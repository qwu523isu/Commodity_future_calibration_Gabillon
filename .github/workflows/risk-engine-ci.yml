name: Risk Engine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-tests:
    name: Python 3.12 risk tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-risk.txt
      - name: Install risk engine dependencies
        run: python -m pip install -r requirements-risk.txt
      - name: Run financial invariants and CLI integration tests
        run: python -m unittest discover -s tests -v
